<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Preconnect to Opay for faster loading -->
    <link rel="preconnect" href="https://www.opayweb.com">
    <link rel="preconnect" href="https://secure.opayweb.com">
    <link rel="dns-prefetch" href="https://www.opayweb.com">
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Content Security Policy for Opay Integration -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https: blob:;
      font-src 'self' data: https://fonts.gstatic.com;
      connect-src 'self' https://www.opayweb.com https://secure.opayweb.com;
      frame-src 'self' https://www.opayweb.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self' https://www.opayweb.com;
    ">
    
    <title>NAPPS North Central Zone - Official Portal for Private School Proprietors</title>
    <meta name="description" content="Official portal for NAPPS North Central Zone private school proprietors. Register your school, pay dues, and get your official NAPPS ID covering Benue, Kogi, Kwara, Niger, Nasarawa, Plateau & FCT." />
    <meta name="author" content="NAPPS North Central Zone" />
    <meta name="keywords" content="NAPPS, North Central, private schools, proprietors, registration, payment, dues, Nigeria, Benue, Kogi, Kwara, Niger, Nasarawa, Plateau, FCT" />

    <meta property="og:title" content="NAPPS North Central Zone - Official Portal" />
    <meta property="og:description" content="Official portal for private school proprietors across Benue, Kogi, Kwara, Niger, Nasarawa, Plateau & FCT. Register, pay dues, get your NAPPS ID." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NAPPS North Central Zone" />
    <meta name="twitter:description" content="Official portal for private school proprietors in North Central Nigeria" />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  </body>
</html>
